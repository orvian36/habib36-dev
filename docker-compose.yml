services:
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      CHATBOT_URL: http://chatbot:8001
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      INGEST_HMAC_SECRET: ${INGEST_HMAC_SECRET}
    depends_on:
      - chatbot
    networks:
      - internal

  chatbot:
    build: ./apps/chatbot
    # NO ports: only reachable inside the internal network
    env_file: ./apps/chatbot/.env
    environment:
      DATABASE_URL: ${CHATBOT_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
